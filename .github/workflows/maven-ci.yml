---
name: maven test and build
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  test:
    name: run mvn test
    runs-on: ubuntu-latest
    outputs:
      artifact-data: $ {{ steps.artifact-name.outputs.artifact-data }}
    steps:
    - name: get sourcecode
      uses: actions/checkout@v6
    - name: get java
      uses: actions/checkout@v5
      with:
        distribution: 'temurin'
        version: '17'
    - name: running tests
      run: mvn test

  build:
    needs: test
    name: building mvn
    runs-on: ubuntu-latest
    steps:
      - name: getting sourcecode
        uses: actions/checkout@v6
      - name: java setup
        uses: actions/checkout@v5
        with:
          distribution: 'temurin'
          version: '17'
      - name: generating jar
        run: mvn clean package
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-data
          path: 'target/*.jar'
      - name: Get name of the output file
        id: artifact-name
        run: find target/*.jar -type f -execdir echo 'artifact-data={}' >> $GITHUB_OUTPUT ';'

  deploy:
    needs: build
    name: taking artifacts of maven
    runs-on: ubuntu-latest
    steps:
      - name: get artifacts from build job
        uses: actions/download-artifact@v8
        with:
          name: artifact-data
      - name: list my artifact
        run: ls
      - name: getting artifact file name
        run: echo $ {{ needs.build.outputs.artifact-data }}
      


